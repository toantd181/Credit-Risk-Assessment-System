<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Assessment System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }

        .status-online {
            background: #4caf50;
        }

        .status-offline {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn .spinner {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .btn.loading .spinner {
            display: block;
        }

        .btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            grid-column: 1 / -1;
        }

        .result-content {
            display: none;
        }

        .result-content.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .decision-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.2em;
            margin: 20px 0;
        }

        .approved {
            background: #4caf50;
            color: white;
        }

        .rejected {
            background: #f44336;
            color: white;
        }

        .review {
            background: #ff9800;
            color: white;
        }

        .risk-meter {
            margin: 20px 0;
        }

        .risk-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .risk-fill {
            height: 100%;
            transition: width 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .risk-low {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
        }

        .risk-medium {
            background: linear-gradient(90deg, #ff9800, #ffc107);
        }

        .risk-high {
            background: linear-gradient(90deg, #f44336, #e91e63);
        }

        .analysis-section {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .analysis-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .analysis-item {
            padding: 10px;
            margin: 10px 0;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }

        .factor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .factor-label {
            font-weight: 600;
            color: #333;
        }

        .factor-value {
            color: #666;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .result-card {
                grid-column: 1;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }

        .info-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .api-status {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 Credit Risk Assessment System</h1>
            <p>AI-Powered Loan Application Evaluation using PyTorch Neural Network</p>
            <div class="api-status">
                API Status: <span id="apiStatus">Checking...</span>
                <span id="statusIndicator" class="status-indicator"></span>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>📋 Applicant Information</h2>
                <form id="creditForm">
                    <div class="form-group">
                        <label>Credit Score *</label>
                        <input type="number" id="credit_score" min="300" max="850" value="680" required>
                        <span class="info-text">Range: 300-850</span>
                    </div>

                    <div class="form-group">
                        <label>Annual Income ($) *</label>
                        <input type="number" id="income" min="0" value="50000" required>
                    </div>

                    <div class="form-group">
                        <label>Loan Amount ($) *</label>
                        <input type="number" id="loan_amount" min="0" value="25000" required>
                    </div>

                    <div class="form-group">
                        <label>Employment Length (years) *</label>
                        <input type="number" id="employment_length" min="0" max="50" value="5" required>
                    </div>

                    <div class="form-group">
                        <label>Age *</label>
                        <input type="number" id="age" min="18" max="100" value="35" required>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>💼 Financial Details</h2>
                <form>
                    <div class="form-group">
                        <label>Loan-to-Value Ratio (LTV %) *</label>
                        <input type="number" id="ltv" min="0" max="200" value="80" required>
                        <span class="info-text">Typical range: 50-100%</span>
                    </div>

                    <div class="form-group">
                        <label>Debt-to-Income Ratio (%) *</label>
                        <input type="number" id="dti" min="0" max="100" value="35" required>
                        <span class="info-text">Lower is better (usually &lt;43%)</span>
                    </div>

                    <div class="form-group">
                        <label>Number of Open Accounts</label>
                        <input type="number" id="open_accounts" min="0" value="5">
                    </div>

                    <div class="form-group">
                        <label>Property Value ($)</label>
                        <input type="number" id="property_value" min="0" value="300000">
                    </div>

                    <div class="form-group">
                        <label>Loan Purpose</label>
                        <select id="loan_purpose">
                            <option value="home">Home Purchase</option>
                            <option value="refinance">Refinance</option>
                            <option value="business">Business</option>
                            <option value="personal">Personal</option>
                            <option value="education">Education</option>
                        </select>
                    </div>

                    <button type="button" class="btn" id="assessBtn" onclick="assessRisk()">
                        <span class="btn-text">🔍 Assess Credit Risk</span>
                        <div class="spinner"></div>
                    </button>
                </form>
            </div>

            <div class="card result-card">
                <h2>📊 Assessment Results</h2>
                <div id="results" class="result-content">
                    <!-- Results will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = 'http://localhost:5000';

        // Check API status on load
        window.addEventListener('load', checkAPIStatus);

        async function checkAPIStatus() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (data.status === 'healthy' && data.model_loaded) {
                    document.getElementById('apiStatus').textContent = 'Online';
                    document.getElementById('statusIndicator').className = 'status-indicator status-online';
                } else {
                    document.getElementById('apiStatus').textContent = 'Model Not Loaded';
                    document.getElementById('statusIndicator').className = 'status-indicator status-offline';
                }
            } catch (error) {
                document.getElementById('apiStatus').textContent = 'Offline';
                document.getElementById('statusIndicator').className = 'status-indicator status-offline';
                console.error('API Status Check Failed:', error);
            }
        }

        async function assessRisk() {
            const btn = document.getElementById('assessBtn');
            const resultsDiv = document.getElementById('results');

            // Disable button and show loading
            btn.disabled = true;
            btn.classList.add('loading');

            // Get form values
            const applicationData = {
                credit_score: parseFloat(document.getElementById('credit_score').value),
                income: parseFloat(document.getElementById('income').value),
                loan_amount: parseFloat(document.getElementById('loan_amount').value),
                employment_length: parseFloat(document.getElementById('employment_length').value),
                age: parseFloat(document.getElementById('age').value),
                ltv: parseFloat(document.getElementById('ltv').value),
                dti: parseFloat(document.getElementById('dti').value),
                open_accounts: parseFloat(document.getElementById('open_accounts').value),
                property_value: parseFloat(document.getElementById('property_value').value),
                loan_purpose: document.getElementById('loan_purpose').value
            };

            try {
                // Call backend API
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(applicationData)
                });

                const result = await response.json();

                if (result.success) {
                    displayResults(result);
                } else {
                    displayError(result.error || 'Prediction failed');
                }
            } catch (error) {
                console.error('Error:', error);
                displayError('Unable to connect to API. Please ensure the backend server is running.');
            } finally {
                // Re-enable button
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        function displayResults(result) {
            const resultsDiv = document.getElementById('results');
            
            // Map decision to CSS class
            const decisionClasses = {
                'APPROVED': 'approved',
                'REJECTED': 'rejected',
                'MANUAL_REVIEW': 'review'
            };

            // Map risk level to CSS class
            const riskClasses = {
                'LOW': 'risk-low',
                'MEDIUM': 'risk-medium',
                'HIGH': 'risk-high'
            };

            const decisionClass = decisionClasses[result.decision] || 'review';
            const riskClass = riskClasses[result.risk_level] || 'risk-medium';

            // Format decision text
            const decisionText = {
                'APPROVED': '✅ APPROVED',
                'REJECTED': '❌ REJECTED',
                'MANUAL_REVIEW': '⚠️ MANUAL REVIEW REQUIRED'
            };

            const resultsHTML = `
                <div class="decision-badge ${decisionClass}">
                    ${decisionText[result.decision]}
                </div>
                
                <div class="risk-meter">
                    <h3>Risk Score: ${result.risk_score}/100</h3>
                    <p style="color: #666; margin: 10px 0;">Model Confidence: ${result.confidence}%</p>
                    <div class="risk-bar">
                        <div class="risk-fill ${riskClass}" style="width: ${result.risk_score}%">
                            ${result.risk_score}%
                        </div>
                    </div>
                </div>

                <div class="analysis-section">
                    <h3>💡 Recommendation</h3>
                    <p>${result.recommendation}</p>
                </div>

                <div class="analysis-section">
                    <h3>📈 Key Factors Analysis</h3>
                    ${result.factors.map(f => `
                        <div class="analysis-item">
                            <div class="factor-label">${f.label}</div>
                            <div class="factor-value">${f.detail}</div>
                        </div>
                    `).join('')}
                </div>

                <div class="analysis-section">
                    <h3>📋 Application Summary</h3>
                    <div class="factor">
                        <span class="factor-label">Credit Score:</span>
                        <span class="factor-value">${result.application_summary.credit_score}</span>
                    </div>
                    <div class="factor">
                        <span class="factor-label">Annual Income:</span>
                        <span class="factor-value">$${result.application_summary.income?.toLocaleString()}</span>
                    </div>
                    <div class="factor">
                        <span class="factor-label">Requested Loan:</span>
                        <span class="factor-value">$${result.application_summary.loan_amount?.toLocaleString()}</span>
                    </div>
                    <div class="factor">
                        <span class="factor-label">LTV Ratio:</span>
                        <span class="factor-value">${result.application_summary.ltv}%</span>
                    </div>
                    <div class="factor">
                        <span class="factor-label">DTI Ratio:</span>
                        <span class="factor-value">${result.application_summary.dti}%</span>
                    </div>
                    <div class="factor">
                        <span class="factor-label">Applicant Age:</span>
                        <span class="factor-value">${result.application_summary.age} years</span>
                    </div>
                </div>
            `;

            resultsDiv.innerHTML = resultsHTML;
            resultsDiv.classList.add('show');
            
            // Scroll to results
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function displayError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="error-message">
                    <strong>⚠️ Error:</strong><br>
                    ${message}
                    <br><br>
                    <strong>Troubleshooting:</strong>
                    <ul style="margin: 10px 0; padding-left: 20px;">
                        <li>Ensure the Flask backend is running on http://localhost:5000</li>
                        <li>Check that the model file exists in the backend directory</li>
                        <li>Verify all required fields are filled correctly</li>
                    </ul>
                </div>
            `;
            resultsDiv.classList.add('show');
        }
    </script>
</body>
</html>
